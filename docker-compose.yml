name: plasmid-mapper

services:
  app:
    build: .
    image: plasmid-mapper
    environment:
      - PORT=8080
    ports:
      # HOST_PORT 配置宿主机端口（默认 8080）
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - plasmid-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # 一次性校验服务：等待 app 健康后依次执行代码测试、前端构建和
  # 跨末端片段的 API 冒烟，并以退出码报告结果。
  verify:
    image: plasmid-mapper
    build: .
    depends_on:
      app:
        condition: service_healthy
    environment:
      - APP_URL=http://app:8080
    command: >
      sh -c "npm test
      && npm run build
      && node scripts/smoke.js"
    restart: "no"

volumes:
  plasmid-data:
