services:
  app:
    build: .
    image: plasmid-verify-app
    environment:
      PORT: "3000"
    ports:
      # 通过宿主机环境变量 HOST_PORT 配置对外端口，默认 8080。
      - "${HOST_PORT:-8080}:3000"
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 4s
    restart: unless-stopped

  verify:
    image: plasmid-verify-app
    build: .
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://app:3000
    entrypoint: ["sh", "scripts/verify.sh"]
    command: []
    restart: "no"
